name: Update REC Dashboard from Jira

on:
  schedule:
    # Робочі дні, кожні 2 години 09:00–19:00 за Києвом (як домовились 09.10.2026).
    # GitHub cron — у UTC і не знає про літній/зимовий час, тож запускаємось щогодини
    # у вікні, що покриває обидва зсуви (UTC+3 → 06–16, UTC+2 → 07–17), а джоба `gate`
    # пропускає все, крім потрібних київських годин. :07 і :37 — запас на випадок,
    # коли GitHub пропускає запуск; другий у ту саму годину лише no-op (дані не змінились).
    - cron: '7 6-17 * * 1-5'
    - cron: '37 6-17 * * 1-5'
  workflow_dispatch: {}   # ручний запуск з вкладки Actions — завжди, без перевірки години

permissions:
  contents: write   # needed to commit & push refreshed HTML

concurrency:
  group: update-rec-dashboard
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          H=$(TZ=Europe/Kyiv date +%-H)
          D=$(TZ=Europe/Kyiv date +%u)   # 1 = пн … 7 = нд
          if [ "${{ github.event_name }}" != "schedule" ]; then RUN=true
          elif [ "$D" -le 5 ] && case " 9 11 13 15 17 19 " in *" $H "*) true;; *) false;; esac; then RUN=true
          else RUN=false; fi
          echo "Kyiv: day=$D hour=$H → run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run updater
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 scripts/update_rec_dashboard.py

      - name: Commit & push if data changed
        run: |
          git config user.name  "rec-dashboard-bot[github-actions]"
          git config user.email "rec-dashboard-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain reports/REC_recruitment_dashboard.html)" ]]; then
            git add reports/REC_recruitment_dashboard.html
            git commit -m "chore(rec): auto-refresh dashboard data from Jira [skip ci]"
            # Retry push with rebase up to 3 times — handles race conditions
            # when a human (or another bot run) pushes while this job runs.
            for i in 1 2 3; do
              if git push; then
                echo "✓ Dashboard updated and pushed (attempt $i)."
                exit 0
              fi
              echo "Push attempt $i rejected, rebasing on remote main..."
              git pull --rebase origin main
              sleep 2
            done
            echo "✗ Failed to push after 3 attempts."
            exit 1
          else
            echo "ℹ No data changes — skipping commit."
          fi
