<html lang="uk">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sf:#161c24;--sf2:#1e2730;--sf3:#232d38;
  --br:#2a3441;--br2:#3a4555;
  --blue:#4a9eff;--blue-d:#1a3a5c;
  --grn:#34d399;--grn-d:#0d3326;
  --amb:#fbbf24;--amb-d:#3d2d00;
  --pnk:#f472b6;--pnk-d:#3d1130;
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#4a5568;
  --f:'DM Sans',sans-serif;--m:'DM Mono',monospace;
  --r:10px;
}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--sf);border-bottom:1px solid var(--br);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.hdr-l{display:flex;align-items:center;gap:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,158,255,.4)}50%{box-shadow:0 0 0 6px rgba(74,158,255,0)}}
.hdr h1{font-size:15px;font-weight:500;letter-spacing:-.2px}
.badge{background:var(--blue-d);color:var(--blue);font-size:11px;font-family:var(--m);padding:3px 8px;border-radius:4px}
.back{color:var(--tx2);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .15s}
.back:hover{color:var(--tx)}.back::before{content:'←'}

.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.sp{padding-top:40px}
.lbl{font-size:11px;font-family:var(--m);color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}

.si{position:relative}
.si input{width:100%;background:var(--sf);border:1px solid var(--br2);border-radius:var(--r);padding:14px 48px 14px 16px;font-size:16px;font-family:var(--f);color:var(--tx);outline:none;transition:border-color .2s}
.si input:focus{border-color:var(--blue)}.si input::placeholder{color:var(--tx3)}
.si-ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:20px;pointer-events:none}
.dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--sf2);border:1px solid var(--br2);border-radius:var(--r);max-height:300px;overflow-y:auto;z-index:100;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.dd.open{display:block}
.ddi{padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.ddi:last-child{border-bottom:none}.ddi:hover{background:var(--sf3)}
.ddi .cnt{font-family:var(--m);font-size:12px;color:var(--tx3);background:var(--sf3);padding:2px 7px;border-radius:4px}
.dd-empty{padding:16px;color:var(--tx3);text-align:center;font-size:13px}

.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--br2);font-size:13px;cursor:pointer;transition:all .15s;color:var(--tx2);background:transparent;font-family:var(--f)}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue-d);border-color:var(--blue);color:var(--blue);font-weight:500}

.empty{max-width:860px;margin:72px auto;padding:0 24px;text-align:center}
.empty-ico{font-size:48px;margin-bottom:16px;opacity:.25}
.empty p{color:var(--tx3);font-size:14px;line-height:1.8}

.res{max-width:860px;margin:32px auto 80px;padding:0 24px;display:none}
.res.on{display:block}
.rt{font-size:22px;font-weight:600;letter-spacing:-.4px;margin-bottom:4px}
.rs{color:var(--tx2);font-size:13px;margin-bottom:24px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:640px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.c-b::after{background:var(--blue)}.c-g::after{background:var(--grn)}
.c-a::after{background:var(--amb)}.c-p::after{background:var(--pnk)}
.cv{font-size:11px;color:var(--tx3);font-family:var(--m);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.cn{font-size:28px;font-weight:600;font-family:var(--m);line-height:1}
.c-b .cn{color:var(--blue)}.c-g .cn{color:var(--grn)}.c-a .cn{color:var(--amb)}.c-p .cn{color:var(--pnk)}
.cs{font-size:11px;color:var(--tx3);margin-top:6px}

.sec{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:20px;margin-bottom:14px}
.st{font-size:11px;font-family:var(--m);color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sn{width:155px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.sbw{flex:1;background:var(--sf3);border-radius:3px;height:7px;overflow:hidden}
.sb{height:100%;border-radius:3px;background:var(--blue);width:0;transition:width .7s cubic-bezier(.4,0,.2,1)}
.sc{width:36px;text-align:right;font-family:var(--m);font-size:12px;color:var(--tx2)}
.sp2{width:36px;text-align:right;font-family:var(--m);font-size:11px;color:var(--tx3)}

.hw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 10px;text-align:left;font-size:10px;font-family:var(--m);color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--br);font-weight:400;white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--br);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.snb{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;font-family:var(--m);white-space:nowrap}
.s-i{background:#1a1a3a;color:#818cf8}.s-j{background:#0f2d1f;color:#34d399}
.s-m{background:#1a2d0f;color:#86efac}.s-s{background:#1a1a00;color:#fbbf24}
.s-e{background:#3d1130;color:#f472b6}.s-n{background:var(--sf3);color:var(--tx3)}
.jl{color:var(--blue);text-decoration:none;font-family:var(--m);font-size:12px;display:inline-flex;align-items:center;gap:3px;transition:opacity .15s;white-space:nowrap}
.jl:hover{opacity:.6}.jl::after{content:'↗';font-size:9px}
.hl{font-family:var(--m);font-size:11px;color:var(--tx3);background:var(--sf3);padding:2px 7px;border-radius:4px}
.mv{font-family:var(--m);font-size:13px}
.fg{color:var(--grn)}.fa{color:var(--amb)}.fr{color:#f87171}.fn{color:var(--tx3)}
.nd{color:var(--tx3)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:3px}
</style>
</head>

let role=null,sn='all';
const idx={};
DATA.forEach(r=>{if(!r.name)return;(idx[r.name]=idx[r.name]||[]).push(r);});
const names=Object.keys(idx).sort();

const inp=document.getElementById('inp');
const dd=document.getElementById('dd');
const emp=document.getElementById('emp');
const res=document.getElementById('res');

inp.addEventListener('input',()=>{
  const q=inp.value.trim().toLowerCase();
  if(!q){dd.classList.remove('open');return;}
  const m=names.filter(n=>n.toLowerCase().includes(q)).slice(0,14);
  dd.innerHTML=m.length
    ?m.map(n=>`<div class="ddi" data-n="${esc(n)}"><span>${esc(n)}</span><span class="cnt">${idx[n].length}</span></div>`).join('')
    :'<div class="dd-empty">Нічого не знайдено</div>';
  dd.querySelectorAll('.ddi').forEach(el=>el.addEventListener('click',()=>pick(el.dataset.n)));
  dd.classList.add('open');
});
document.addEventListener('click',e=>{if(!e.target.closest('.si'))dd.classList.remove('open');});

function pick(n){role=n;inp.value=n;dd.classList.remove('open');render();}

document.getElementById('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');sn=c.dataset.sn;if(role)render();
});

function days(a,b){if(!a||!b)return null;const d=Math.round((new Date(b)-new Date(a))/86400000);return d>=0?d:null;}
function avg(a){const v=a.filter(x=>x!==null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null;}
function ttfCls(d){if(d===null)return'fn';return d<=30?'fg':d<=60?'fa':'fr';}
function snBadge(s){if(!s)return'<span class="snb s-n">—</span>';const k={Intern:'i',Junior:'j',Middle:'m',Senior:'s',Expert:'e',Lead:'e'}[s]||'n';return`<span class="snb s-${k}">${s}</span>`;}
function fmtDate(d){if(!d)return'<span class="nd">—</span>';const[y,m,dd2]=d.split('-');return`${dd2}.${m}.${y}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  if(!role)return;
  const rows=(idx[role]||[]).filter(r=>sn==='all'||r.sn===sn)
    .sort((a,b)=>(b.cr||'').localeCompare(a.cr||''));
  if(!rows.length){
    res.classList.remove('on');
    emp.innerHTML=`<div class="empty-ico">📭</div><p>Немає закритих вакансій для <strong style="color:var(--tx2)">${esc(role)}</strong>${sn!=='all'?' / '+sn:''}</p>`;
    return;
  }
  emp.style.display='none';
  res.classList.add('on');
  const ttfs=rows.map(r=>days(r.sd,r.cr));
  const tths=rows.map(r=>days(r.fcd,r.cr));
  const aT=avg(ttfs),aH=avg(tths);
  const sm={};rows.forEach(r=>{const s=r.cs||'Невідомо';sm[s]=(sm[s]||0)+1;});
  const ss=Object.entries(sm).sort(([,a],[,b])=>b-a);
  const top=ss[0]?.[0]||'—';const mx=ss[0]?.[1]||1;

  res.innerHTML=`
<div class="rt">${esc(role)}</div>
<div class="rs">${rows.length} закрит${rows.length===1?'а':rows.length<5?'их':'их'} · ${sn==='all'?'всі рівні':sn}</div>
<div class="cards">
  <div class="card c-b"><div class="cv">Закриттів</div><div class="cn">${rows.length}</div><div class="cs">за весь час</div></div>
  <div class="card c-g"><div class="cv">Avg TTF</div><div class="cn">${aT!==null?aT+'d':'—'}</div><div class="cs">відкриття → закриття</div></div>
  <div class="card c-a"><div class="cv">Avg TTH</div><div class="cn">${aH!==null?aH+'d':'—'}</div><div class="cs">контакт → hire</div></div>
  <div class="card c-p"><div class="cv">Топ джерело</div><div class="cn" style="font-size:${top.length>10?'14px':'20px'};line-height:1.3">${esc(top)}</div><div class="cs">${sm[top]} hire${sm[top]>1?'s':''}</div></div>
</div>
<div class="sec">
  <div class="st">Джерела найму</div>
  ${ss.map(([n,c])=>`<div class="sr"><div class="sn">${esc(n)}</div><div class="sbw"><div class="sb" data-w="${Math.round(c/mx*100)}"></div></div><div class="sc">${c}</div><div class="sp2">${Math.round(c/rows.length*100)}%</div></div>`).join('')}
</div>
<div class="sec">
  <div class="st">Історія закриттів</div>
  <div class="hw"><table>
  <thead><tr><th>Дата</th><th>Рівень</th><th>Рекрутер</th><th>Джерело</th><th>TTF</th><th>TTH</th><th>Jira</th></tr></thead>
  <tbody>
  ${rows.map((r,i)=>{
    const tf=days(r.sd,r.cr),th=days(r.fcd,r.cr);
    const jk=r.hist?null:(r.key.startsWith('REC-')?r.key:r.pk);
    return`<tr>
      <td>${fmtDate(r.cr)}</td>
      <td>${snBadge(r.sn)}</td>
      <td style="color:var(--tx2)">${esc(r.rec||'—')}</td>
      <td style="color:var(--tx2)">${esc(r.cs||'—')}</td>
      <td><span class="mv ${ttfCls(tf)}">${tf!==null?tf+'d':'—'}</span></td>
      <td><span class="mv ${ttfCls(th)}">${th!==null?th+'d':'—'}</span></td>
      <td>${jk?`<a class="jl" href="${JIRA}${jk}" target="_blank">${jk}</a>`:'<span class="hl">Historical</span>'}</td>
    </tr>`;
  }).join('')}
  </tbody></table></div>
</div>`;
  setTimeout(()=>{
    document.querySelectorAll('.sb[data-w]').forEach(b=>{
      const w=b.dataset.w;
      requestAnimationFrame(()=>{ b.style.width=w+'%'; });
    });
  },60);
}
</script>
</body></html>
